  responses (observed headers: server nginx, etag, access-control-allow-origin, HSTS, CSP, x-frame-options,
  x-content-type-options, referrer-policy, permissions-policy). The metering that does exist is per-call USDC
  pricing over x402 (see plans/) and on-chain caps on the vault contracts. An honest zero.
