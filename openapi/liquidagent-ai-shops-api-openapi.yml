openapi: 3.2.0
info:
  title: 'Liquid Agent: Money Tools for AI Agents Shops API'
  version: 1.0.0
  description: 'x402 money tools for AI agents: verified local business leads (6.0M businesses in 42 US states, websites proven by the business''s own phone, graded emails, buying signals, $0.03 a lead), a one-signature USDC bridge from Base to 16 chains, the live Polymarket price to beat (BTC, ETH, SOL, XRP on 5m and 15m), a tokenized US stock basket from $1, and gas paid in USDC, plus free USDC and x402 debugging tools and a remote MCP server (31 tools). No account, no API key. Part of Liquid Agent, the money layer for humans and their agents: one USDC balance for yield, payments, and tokenized stocks, for people through the app and for agents over x402. This API lets you buy and invest in tokenized US stocks on-chain from $1: NVIDIA, Apple, Meta and Alphabet. Mint your own vault holding a band-rebalanced stock basket, equal-weight or your custom portfolio, and rebalance or cash out any block. Self-priced NAV (no oracle), in-kind exit, no brokerage account, no project token. Reads are free; transactions return unsigned calldata the agent signs and broadcasts with its own gas.'
  contact:
    name: Liquid Agent
    url: https://api.liquidagent.ai
    email: liquidagentai@gmail.com
  x-guidance: 'Liquid Agent is the money layer for humans and their agents: one USDC balance for yield, payments, and tokenized stocks, for people through the app and for agents over x402. This API is the agent-facing tokenized-stock index. It lets an agent mint its OWN vault holding a band-rebalanced basket of Coinbase''s tokenized NVDA/META/AAPL/GOOGL on Base (eip155:8453). Reads are FREE; every POST returns an UNSIGNED {to,data,value,chainId} that YOU sign and broadcast with your own gas (the server never signs). Amounts are USDC-6 (2000000 = $2). weightsBps are basis points summing to 10000. FLOW: 1) GET /v1/basket — discover constituents + live prices + fees. 2) GET /v1/quote?usdc=<amount6> — preview shares + mint fee. 3) POST /v1/create-vault — unsigned createVault(); sign+broadcast (you become the sole strategist, the protocol Safe owns it for fees). 4) GET /v1/balance/<your-address> — your new vault address. 5) POST /v1/set-weights {vault,weightsBps:[4]} — optional custom allocation. 6) POST /v1/buy {vault,usdc,permit:true,owner} — EIP-712 permit to sign off-chain, then re-POST with permit:{deadline,signature} for ONE unsigned depositWithPermit tx (no approve; omit permit for legacy approve+deposit). 7) POST /v1/rebalance {vault} — move to your target. 8) GET /v1/vault/<vault> — NAV + weights (self-priced TWAP, no oracle). 9) POST /v1/redeem {vault,shares,inKind?} — exit to USDC or raw tokens (un-trappable, any block). REUSE: create-vault is a ONE-TIME step. To add funds later do NOT create again — GET /v1/balance/<you>, take vaults[0].vault, and POST /v1/buy into that same vault (each buy mints more shares). create-vault always makes a brand-new separate vault. Contracts: factory 0x1B205660780CbC57849019Df2BA64B719b00AEA8, USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913. Broadcast over any Base RPC (e.g. an x402 RPC); deposits swap precompile tokens so pass an explicit gas limit ~3,000,000.'
servers:
- url: https://api.liquidagent.ai
tags:
- name: Shops
paths:
  /v1/shop/mintandmarquee:
    get:
      operationId: getV1Shopmintandmarquee
      summary: 'Mint & Marquee: what the shop sells, price range and how to search (free)'
      tags:
      - Shops
      description: 'Free. Custom 3D printed collectibles and gifts: figurines, statues, keychains, bag tags and branded merch. Soccer, anime, crypto, hypebeast and ancient-art collections. Lists the product count, price range and the paid search.'
      security:
      - siwx: []
      responses:
        '200':
          description: shop info
          content:
            application/json:
              schema:
                type: object
  /v1/shop/mintandmarquee/search:
    get:
      operationId: getV1ShopmintandmarqueeSearch
      summary: 'Search Mint & Marquee for gifts and collectibles: products with price, photo…'
      tags:
      - Shops
      description: 'PAID: $0.001 USDC per search via x402 (exact scheme, EIP-3009, USDC on Arc eip155:5042, Base eip155:8453 or Polygon eip155:137). Custom 3D printed collectibles and gifts: figurines, statues, keychains, bag tags and branded merch. Soccer, anime, crypto, hypebeast and ancient-art collections.'
      security:
      - x402: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
          example: soccer gift
        description: What to find, in words.
      - name: max
        in: query
        required: false
        schema:
          type: number
          example: 30
        description: Optional price ceiling in USD.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        description: How many products, 1 to 10 (default 5).
      x-payment:
        price: '0.001'
        currency: USDC
        network: eip155:8453
        asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
        payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        scheme: exact
      x-payment-info:
        protocols:
        - x402:
            scheme: exact
            network: eip155:5042
            asset: '0x3600000000000000000000000000000000000000'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        - x402:
            scheme: exact
            network: eip155:8453
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        - x402:
            scheme: exact
            network: eip155:137
            asset: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        price:
          mode: fixed
          currency: USD
          amount: '0.001'
      responses:
        '200':
          description: matching products
          content:
            application/json:
              schema:
                type: object
        '402':
          description: x402 payment required (returns the payment challenge)
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    siwx:
      type: apiKey
      in: header
      name: SIGN-IN-WITH-X
      description: Sign-In with X wallet identity (EIP-4361). Optional; no payment.
    x402:
      type: http
      scheme: x402
      description: Pay-per-call via x402 (exact scheme, EIP-3009 USDC on Base eip155:8453 or Polygon eip155:137). Sign a USDC authorization; no account, no key held by the server.
externalDocs:
  description: Open-source code examples (JavaScript/viem, Python/web3, curl) + README for the full create/buy/rebalance/exit flow.
  url: https://github.com/LiquidAgent/liquidagentx402
