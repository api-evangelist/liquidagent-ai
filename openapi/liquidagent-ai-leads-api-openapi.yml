openapi: 3.2.0
info:
  title: 'Liquid Agent: Money Tools for AI Agents Leads API'
  version: 1.0.0
  description: 'x402 money tools for AI agents: verified local business leads (6.0M businesses in 42 US states, websites proven by the business''s own phone, graded emails, buying signals, $0.03 a lead), a one-signature USDC bridge from Base to 16 chains, the live Polymarket price to beat (BTC, ETH, SOL, XRP on 5m and 15m), a tokenized US stock basket from $1, and gas paid in USDC, plus free USDC and x402 debugging tools and a remote MCP server (31 tools). No account, no API key. Part of Liquid Agent, the money layer for humans and their agents: one USDC balance for yield, payments, and tokenized stocks, for people through the app and for agents over x402. This API lets you buy and invest in tokenized US stocks on-chain from $1: NVIDIA, Apple, Meta and Alphabet. Mint your own vault holding a band-rebalanced stock basket, equal-weight or your custom portfolio, and rebalance or cash out any block. Self-priced NAV (no oracle), in-kind exit, no brokerage account, no project token. Reads are free; transactions return unsigned calldata the agent signs and broadcasts with its own gas.'
  contact:
    name: Liquid Agent
    url: https://api.liquidagent.ai
    email: liquidagentai@gmail.com
  x-guidance: 'Liquid Agent is the money layer for humans and their agents: one USDC balance for yield, payments, and tokenized stocks, for people through the app and for agents over x402. This API is the agent-facing tokenized-stock index. It lets an agent mint its OWN vault holding a band-rebalanced basket of Coinbase''s tokenized NVDA/META/AAPL/GOOGL on Base (eip155:8453). Reads are FREE; every POST returns an UNSIGNED {to,data,value,chainId} that YOU sign and broadcast with your own gas (the server never signs). Amounts are USDC-6 (2000000 = $2). weightsBps are basis points summing to 10000. FLOW: 1) GET /v1/basket — discover constituents + live prices + fees. 2) GET /v1/quote?usdc=<amount6> — preview shares + mint fee. 3) POST /v1/create-vault — unsigned createVault(); sign+broadcast (you become the sole strategist, the protocol Safe owns it for fees). 4) GET /v1/balance/<your-address> — your new vault address. 5) POST /v1/set-weights {vault,weightsBps:[4]} — optional custom allocation. 6) POST /v1/buy {vault,usdc,permit:true,owner} — EIP-712 permit to sign off-chain, then re-POST with permit:{deadline,signature} for ONE unsigned depositWithPermit tx (no approve; omit permit for legacy approve+deposit). 7) POST /v1/rebalance {vault} — move to your target. 8) GET /v1/vault/<vault> — NAV + weights (self-priced TWAP, no oracle). 9) POST /v1/redeem {vault,shares,inKind?} — exit to USDC or raw tokens (un-trappable, any block). REUSE: create-vault is a ONE-TIME step. To add funds later do NOT create again — GET /v1/balance/<you>, take vaults[0].vault, and POST /v1/buy into that same vault (each buy mints more shares). create-vault always makes a brand-new separate vault. Contracts: factory 0x1B205660780CbC57849019Df2BA64B719b00AEA8, USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913. Broadcast over any Base RPC (e.g. an x402 RPC); deposits swap precompile tokens so pass an explicit gas limit ~3,000,000.'
servers:
- url: https://api.liquidagent.ai
tags:
- name: Leads
paths:
  /v1/leads:
    get:
      operationId: getV1Leads
      summary: 'Liquid Leads: coverage, parameters, grades and pricing (free)'
      tags:
      - Leads
      security:
      - siwx: []
      description: 'Free. Local business leads by category and place for B2B prospecting and cold outreach: a lead list of US small businesses (dentists, plumbers, salons, contractors...) with verified emails (graded A/B/C), a contact name when the email shows one, phone, a website proven by the business''s own phone number, socials and buying signals (no website, online booking tool, payment system, hiring).'
      responses:
        '200':
          description: service info
          content:
            application/json:
              schema:
                type: object
  /v1/leads/categories:
    get:
      operationId: getV1LeadsCategories
      summary: Which business categories exist in a place, with counts (free)
      tags:
      - Leads
      security:
      - siwx: []
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          example: ga
        description: 2-letter state
      - name: city
        in: query
        required: false
        schema:
          type: string
          example: Atlanta
        description: City
      - name: county
        in: query
        required: false
        schema:
          type: string
          example: Gwinnett
        description: County
      responses:
        '200':
          description: categories
          content:
            application/json:
              schema:
                type: object
  /v1/leads/count:
    get:
      operationId: getV1LeadsCount
      summary: How many leads match, by email grade, and the exact price of the next page…
      tags:
      - Leads
      security:
      - siwx: []
      description: Free. Same parameters as /v1/leads/search.
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
          maxLength: 60
          example: dentist
        description: 'Business type in plain words: dentist, plumber, hvac, roofing, hair salon, law firm, med spa, restaurant.'
      - name: city
        in: query
        required: false
        schema:
          type: string
          example: Atlanta
        description: City, e.g. Atlanta, Savannah, Macon. Or county, zip, or near.
      - name: county
        in: query
        required: false
        schema:
          type: string
        description: County, e.g. Gwinnett, Chatham.
      - name: sample
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
        description: 1 = 3 free leads (3 a day) to judge quality.
      - name: zip
        in: query
        required: false
        schema:
          type: string
          example: '30309'
        description: 5-digit ZIP (a prefix works).
      - name: near
        in: query
        required: false
        schema:
          type: string
          example: 33.7812,-84.3831
        description: lat,lng to search around (with radiusKm).
      - name: radiusKm
        in: query
        required: false
        schema:
          type: number
          example: 5
        description: Radius for near, 0.5-50 (default 5).
      - name: minGrade
        in: query
        required: false
        schema:
          type: string
          enum:
          - A
          - B
          - C
        description: 'Email grade floor: A, B or C (default C).'
      - name: email
        in: query
        required: false
        schema:
          type: string
          enum:
          - required
          - any
          - none
        description: required (default), any, or none.
      - name: website
        in: query
        required: false
        schema:
          type: string
          enum:
          - any
          - has
          - none
          - dead
          - needs
        description: any, has, none, dead, or needs (no working website).
      - name: booking
        in: query
        required: false
        schema:
          type: string
        description: 'Online booking tool: yes, none, vagaro, square_appointments, calendly, booksy, mindbody, acuity, opentable, housecall_pro, jobber, servicetitan, zocdoc.'
      - name: payments
        in: query
        required: false
        schema:
          type: string
        description: 'Payment system seen on the site: yes, none, square, toast, clover, stripe, paypal.'
      - name: platform
        in: query
        required: false
        schema:
          type: string
        description: 'Website platform: wordpress, wix, squarespace, shopify, godaddy, webflow, none.'
      - name: hiring
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
        description: 1 = their site says they are hiring.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          example: 3
        description: How many leads, 1-1000 (default 3); $0.03 per lead.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Skip this many, for the next page.
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - csv
        description: json (default) or csv.
      responses:
        '200':
          description: counts
          content:
            application/json:
              schema:
                type: object
  /v1/leads/search:
    get:
      operationId: getV1LeadsSearch
      summary: Local business leads with checked emails, contact names and buying signals
      tags:
      - Leads
      description: 'PAID: USDC, $0.03 per lead, flat (with or without an email); 1 to 1000 leads per call (default 3 = $0.09); free first: sample=1 returns 3 leads; the 402 quotes the exact total; empty answers are free. x402 exact scheme, EIP-3009 USDC on Base eip155:8453 or Arc eip155:5042. Local business leads by category and place for B2B prospecting and cold outreach: a lead list of US small businesses (dentists, plumbers, salons, contractors...) with verified emails (graded A/B/C), a contact name when the email shows one, phone, a website proven by the business''s own phone number, socials and buying signals (no website, online booking tool, payment system, hiring).'
      security:
      - x402: []
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
          maxLength: 60
          example: dentist
        description: 'Business type in plain words: dentist, plumber, hvac, roofing, hair salon, law firm, med spa, restaurant.'
      - name: city
        in: query
        required: false
        schema:
          type: string
          example: Atlanta
        description: City, e.g. Atlanta, Savannah, Macon. Or county, zip, or near.
      - name: county
        in: query
        required: false
        schema:
          type: string
        description: County, e.g. Gwinnett, Chatham.
      - name: sample
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
        description: 1 = 3 free leads (3 a day) to judge quality.
      - name: zip
        in: query
        required: false
        schema:
          type: string
          example: '30309'
        description: 5-digit ZIP (a prefix works).
      - name: near
        in: query
        required: false
        schema:
          type: string
          example: 33.7812,-84.3831
        description: lat,lng to search around (with radiusKm).
      - name: radiusKm
        in: query
        required: false
        schema:
          type: number
          example: 5
        description: Radius for near, 0.5-50 (default 5).
      - name: minGrade
        in: query
        required: false
        schema:
          type: string
          enum:
          - A
          - B
          - C
        description: 'Email grade floor: A, B or C (default C).'
      - name: email
        in: query
        required: false
        schema:
          type: string
          enum:
          - required
          - any
          - none
        description: required (default), any, or none.
      - name: website
        in: query
        required: false
        schema:
          type: string
          enum:
          - any
          - has
          - none
          - dead
          - needs
        description: any, has, none, dead, or needs (no working website).
      - name: booking
        in: query
        required: false
        schema:
          type: string
        description: 'Online booking tool: yes, none, vagaro, square_appointments, calendly, booksy, mindbody, acuity, opentable, housecall_pro, jobber, servicetitan, zocdoc.'
      - name: payments
        in: query
        required: false
        schema:
          type: string
        description: 'Payment system seen on the site: yes, none, square, toast, clover, stripe, paypal.'
      - name: platform
        in: query
        required: false
        schema:
          type: string
        description: 'Website platform: wordpress, wix, squarespace, shopify, godaddy, webflow, none.'
      - name: hiring
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
        description: 1 = their site says they are hiring.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          example: 3
        description: How many leads, 1-1000 (default 3); $0.03 per lead.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Skip this many, for the next page.
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - csv
        description: json (default) or csv.
      x-payment-info:
        protocols:
        - x402:
            scheme: exact
            network: eip155:8453
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        - x402:
            scheme: exact
            network: eip155:5042
            asset: '0x3600000000000000000000000000000000000000'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        price:
          mode: dynamic
          currency: USD
          min: '0.03'
          max: '30.00'
          description: flat $0.03 per lead returned, with or without an email; default 3 leads = $0.09; sample=1 is free (3 leads); exact total in the 402
      responses:
        '200':
          description: leads (JSON, or CSV with format=csv)
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
        '402':
          description: x402 payment required (the exact total for this query)
          content:
            application/json:
              schema:
                type: object
  /v1/leads/lookup:
    get:
      operationId: getV1LeadsLookup
      summary: 'Reverse phone or website lookup: the US local business behind a phone number or…'
      tags:
      - Leads
      description: 'PAID: $0.01 per lookup that finds a business, no match no charge. x402 exact scheme, EIP-3009 USDC on Base eip155:8453 or Arc eip155:5042. Reverse phone and website lookup for US local businesses: give a phone number or a website, get the business behind it (name, address, category, graded email, contact name, socials, buying signals). Websites only match when they carry the business''s own phone number.'
      security:
      - x402: []
      parameters:
      - name: phone
        in: query
        required: false
        schema:
          type: string
          example: '4043552001'
        description: 'A US phone number, any format: 4043552001, (404) 355-2001, +14043552001. Give phone or domain.'
      - name: domain
        in: query
        required: false
        schema:
          type: string
          example: atlantadentistrybydesign.com
        description: 'Or a website: example.com or https://www.example.com/contact.'
      x-payment-info:
        protocols:
        - x402:
            scheme: exact
            network: eip155:8453
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        - x402:
            scheme: exact
            network: eip155:5042
            asset: '0x3600000000000000000000000000000000000000'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        price:
          mode: fixed
          currency: USD
          amount: '0.01'
      responses:
        '200':
          description: the match (found=false and no charge when nothing matches)
          content:
            application/json:
              schema:
                type: object
        '402':
          description: x402 payment required
          content:
            application/json:
              schema:
                type: object
  /v1/leads/tech:
    get:
      operationId: getV1LeadsTech
      summary: 'Website technology lookup: platform, booking tool, payment system and socials…'
      tags:
      - Leads
      description: 'PAID: $0.005 per lookup that finds a verified site, no match no charge. x402 exact scheme, EIP-3009 USDC on Base eip155:8453 or Arc eip155:5042. Website technology lookup (technographics) for US local businesses: give a website or phone number, get the site platform (WordPress, Wix, Squarespace, Shopify), online booking tool (Square Appointments, Vagaro, Calendly, Zocdoc), payment system (Square, Toast, Clover, Stripe), hiring and socials, read from the business''s own verified website.'
      security:
      - x402: []
      parameters:
      - name: phone
        in: query
        required: false
        schema:
          type: string
          example: '4043552001'
        description: 'A US phone number, any format: 4043552001, (404) 355-2001, +14043552001. Give phone or domain.'
      - name: domain
        in: query
        required: false
        schema:
          type: string
          example: atlantadentistrybydesign.com
        description: 'Or a website: example.com or https://www.example.com/contact.'
      x-payment-info:
        protocols:
        - x402:
            scheme: exact
            network: eip155:8453
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        - x402:
            scheme: exact
            network: eip155:5042
            asset: '0x3600000000000000000000000000000000000000'
            payTo: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
        price:
          mode: fixed
          currency: USD
          amount: '0.005'
      responses:
        '200':
          description: the match (found=false and no charge when nothing matches)
          content:
            application/json:
              schema:
                type: object
        '402':
          description: x402 payment required
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    siwx:
      type: apiKey
      in: header
      name: SIGN-IN-WITH-X
      description: Sign-In with X wallet identity (EIP-4361). Optional; no payment.
    x402:
      type: http
      scheme: x402
      description: Pay-per-call via x402 (exact scheme, EIP-3009 USDC on Base eip155:8453 or Polygon eip155:137). Sign a USDC authorization; no account, no key held by the server.
externalDocs:
  description: Open-source code examples (JavaScript/viem, Python/web3, curl) + README for the full create/buy/rebalance/exit flow.
  url: https://github.com/LiquidAgent/liquidagentx402
