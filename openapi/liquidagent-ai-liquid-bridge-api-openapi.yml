openapi: 3.2.0
info:
  title: 'Liquid Agent: Money Tools for AI Agents Liquid Bridge API'
  version: 1.0.0
  description: 'x402 money tools for AI agents: verified local business leads (6.0M businesses in 42 US states, websites proven by the business''s own phone, graded emails, buying signals, $0.03 a lead), a one-signature USDC bridge from Base to 16 chains, the live Polymarket price to beat (BTC, ETH, SOL, XRP on 5m and 15m), a tokenized US stock basket from $1, and gas paid in USDC, plus free USDC and x402 debugging tools and a remote MCP server (31 tools). No account, no API key. Part of Liquid Agent, the money layer for humans and their agents: one USDC balance for yield, payments, and tokenized stocks, for people through the app and for agents over x402. This API lets you buy and invest in tokenized US stocks on-chain from $1: NVIDIA, Apple, Meta and Alphabet. Mint your own vault holding a band-rebalanced stock basket, equal-weight or your custom portfolio, and rebalance or cash out any block. Self-priced NAV (no oracle), in-kind exit, no brokerage account, no project token. Reads are free; transactions return unsigned calldata the agent signs and broadcasts with its own gas.'
  contact:
    name: Liquid Agent
    url: https://api.liquidagent.ai
    email: liquidagentai@gmail.com
  x-guidance: 'Liquid Agent is the money layer for humans and their agents: one USDC balance for yield, payments, and tokenized stocks, for people through the app and for agents over x402. This API is the agent-facing tokenized-stock index. It lets an agent mint its OWN vault holding a band-rebalanced basket of Coinbase''s tokenized NVDA/META/AAPL/GOOGL on Base (eip155:8453). Reads are FREE; every POST returns an UNSIGNED {to,data,value,chainId} that YOU sign and broadcast with your own gas (the server never signs). Amounts are USDC-6 (2000000 = $2). weightsBps are basis points summing to 10000. FLOW: 1) GET /v1/basket — discover constituents + live prices + fees. 2) GET /v1/quote?usdc=<amount6> — preview shares + mint fee. 3) POST /v1/create-vault — unsigned createVault(); sign+broadcast (you become the sole strategist, the protocol Safe owns it for fees). 4) GET /v1/balance/<your-address> — your new vault address. 5) POST /v1/set-weights {vault,weightsBps:[4]} — optional custom allocation. 6) POST /v1/buy {vault,usdc,permit:true,owner} — EIP-712 permit to sign off-chain, then re-POST with permit:{deadline,signature} for ONE unsigned depositWithPermit tx (no approve; omit permit for legacy approve+deposit). 7) POST /v1/rebalance {vault} — move to your target. 8) GET /v1/vault/<vault> — NAV + weights (self-priced TWAP, no oracle). 9) POST /v1/redeem {vault,shares,inKind?} — exit to USDC or raw tokens (un-trappable, any block). REUSE: create-vault is a ONE-TIME step. To add funds later do NOT create again — GET /v1/balance/<you>, take vaults[0].vault, and POST /v1/buy into that same vault (each buy mints more shares). create-vault always makes a brand-new separate vault. Contracts: factory 0x1B205660780CbC57849019Df2BA64B719b00AEA8, USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913. Broadcast over any Base RPC (e.g. an x402 RPC); deposits swap precompile tokens so pass an explicit gas limit ~3,000,000.'
servers:
- url: https://api.liquidagent.ai
tags:
- name: Liquid Bridge
paths:
  /v1/bridge:
    get:
      operationId: getV1Bridge
      summary: The one-signature USDC bridge for x402 agents.
      tags:
      - Liquid Bridge
      description: 'Move USDC from Base to 16 chains (Arc, Arbitrum, OP Mainnet, Polygon, Avalanche, Unichain, Linea, World Chain, Sonic, Monad, Sei, Ink, HyperEVM, XDC, Plume and Codex), or from Arc to Base, with a single x402 payment. No transaction to build, no approvals, no gas token. You receive exactly the amount you ask for, at your own address, in about 12 seconds. Refer other agents and earn 20% of Liquid''s fee on every bridge they make, credited on-chain in the same transaction. PAID, dynamic: the 402 is the exact price (Arc -> Base: about 1.078 USDC to receive 1; Base -> Arc: about 1.035 USDC to receive 1, payable on Base; minimum 1 USDC; Liquid''s fee can never exceed max(3%, $0.05), enforced on-chain). Query: from=arc|base, to=base|arc, amount=, ref=. Pay once on the source chain (x402 exact, EIP-3009) to that chain''s bridge contract: Arc 0x3bc7bf1afc96c1de35ac48e1a0a3cc3d617a77b1 (USDC domain "USDC" v2) or Base 0xbf43e09b91c4d4aa55e033a3487f345ce4ed7557 (USDC domain "USD Coin" v2). Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - x402: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          enum:
          - arc
          - base
          example: base
      - name: to
        in: query
        required: true
        schema:
          type: string
          enum:
          - arc
          - base
          - arbitrum
          - optimism
          - polygon
          - avalanche
          - unichain
          - linea
          - world
          - sonic
          - monad
          - sei
          - ink
          - hyperevm
          - xdc
          - plume
          - codex
          example: arc
        description: 'Chain you receive on. From Base: any of these except base. From Arc: base.'
      - name: amount
        in: query
        required: true
        schema:
          type: string
          example: '1'
        description: USDC to RECEIVE (minimum 1)
      - name: ref
        in: query
        required: false
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        description: Optional referrer EVM address (earns 20% of Liquid's fee). Omit it unless you have one; an invalid value is ignored.
      x-payment:
        price: dynamic
        currency: USDC
        network: eip155:5042
        asset: '0x3600000000000000000000000000000000000000'
        payTo: '0x3bc7bf1afc96c1de35ac48e1a0a3cc3d617a77b1'
        scheme: exact
        mode: dynamic
      x-payment-info:
        protocols:
        - x402:
            scheme: exact
            network: eip155:8453
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            payTo: '0xbf43e09b91c4d4aa55e033a3487f345ce4ed7557'
        - x402:
            scheme: exact
            network: eip155:5042
            asset: '0x3600000000000000000000000000000000000000'
            payTo: '0x3bc7bf1afc96c1de35ac48e1a0a3cc3d617a77b1'
        price:
          mode: dynamic
          currency: USD
          min: '1.02'
          description: amount to receive + Circle forwarding + Liquid fee + gas; exact USDC in the 402
      responses:
        '200':
          description: '{status, receive, to, recipient, burnTx, mintTx, statusUrl, referrer, referrerEarned}'
          content:
            application/json:
              schema:
                type: object
        '202':
          description: 'sent, still confirming: {burnTx, statusUrl}; do not pay again'
          content:
            application/json:
              schema:
                type: object
        '402':
          description: 'x402 payment required: the exact price'
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/quote:
    get:
      operationId: getV1BridgeQuote
      summary: 'Liquid Bridge: free quote for a route, the exact price without the 402'
      tags:
      - Liquid Bridge
      description: 'Liquid Bridge: free quote for a route, the exact price without the 402. Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          enum:
          - arc
          - base
      - name: to
        in: query
        required: true
        schema:
          type: string
          enum:
          - arc
          - base
          - arbitrum
          - optimism
          - polygon
          - avalanche
          - unichain
          - linea
          - world
          - sonic
          - monad
          - sei
          - ink
          - hyperevm
          - xdc
          - plume
          - codex
        description: 'Chain you receive on. From Base: any listed chain except base. From Arc: base.'
      - name: amount
        in: query
        required: true
        schema:
          type: string
          example: '1'
        description: USDC to RECEIVE (minimum 1)
      - name: ref
        in: query
        required: false
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        description: Optional referrer EVM address (earns 20% of Liquid's fee). Omit it unless you have one; an invalid value is ignored.
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/routes:
    get:
      operationId: getV1BridgeRoutes
      summary: 'Liquid Bridge: every route with its live price and whether it is open'
      tags:
      - Liquid Bridge
      description: 'Liquid Bridge: every route with its live price and whether it is open. Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/status/{burnTx}:
    get:
      operationId: getV1BridgeStatus
      summary: 'Liquid Bridge: Circle attestation and mint state for a bridge'
      tags:
      - Liquid Bridge
      description: 'Liquid Bridge: Circle attestation and mint state for a bridge. Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      parameters:
      - name: burnTx
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          example: '0x2aa8430c29f0c95b9664ceb4cad2a5ee11f8edfb471263281f63938566aa91ae'
      - name: from
        in: query
        required: false
        schema:
          type: string
          enum:
          - arc
          - base
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/referrer/{payer}:
    get:
      operationId: getV1BridgeReferrer
      summary: 'Liquid Bridge: the sticky referrer of a payer (earns 20% of the fee on its…'
      tags:
      - Liquid Bridge
      description: 'Liquid Bridge: the sticky referrer of a payer (earns 20% of the fee on its unreferred bridges). Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      parameters:
      - name: payer
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          example: '0xe1f811EcA59d9996Ff073311711264b4d1310b35'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/earnings/{referrer}:
    get:
      operationId: getV1BridgeEarnings
      summary: 'Liquid Bridge: a referrer''s unclaimed earnings on each chain (Base, Arc) and…'
      tags:
      - Liquid Bridge
      description: 'Liquid Bridge: a referrer''s unclaimed earnings on each chain (Base, Arc) and how to claim them. Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      parameters:
      - name: referrer
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          example: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/balances/{address}:
    get:
      operationId: getV1BridgeBalances
      summary: 'Free: USDC and gas balance of an address on every CCTP chain (Ethereum, Base…'
      tags:
      - Liquid Bridge
      description: 'Free: USDC and gas balance of an address on every CCTP chain (Ethereum, Base, Arbitrum, OP, Polygon, Avalanche, Unichain, Linea, Sonic, World Chain, Arc). Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          example: '0x487b28A4FbbA8Cf46eb6E1d72e6959202Bb75e90'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/cctp/{txHash}:
    get:
      operationId: getV1BridgeCctp
      summary: 'Free: status of ANY Circle CCTP v2 transfer by burn tx: attestation, mint…'
      tags:
      - Liquid Bridge
      description: 'Free: status of ANY Circle CCTP v2 transfer by burn tx: attestation, mint check, and how to finish a stuck one. Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      parameters:
      - name: txHash
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          example: '0x2aa8430c29f0c95b9664ceb4cad2a5ee11f8edfb471263281f63938566aa91ae'
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/proof:
    get:
      operationId: getV1BridgeProof
      summary: 'Proof of delivery: every Liquid Bridge transfer with burn tx, mint tx, fee, and…'
      tags:
      - Liquid Bridge
      description: 'Proof of delivery: every Liquid Bridge transfer with burn tx, mint tx, fee, and the incident record. Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
  /v1/bridge/guide:
    get:
      operationId: getV1BridgeGuide
      summary: 'Liquid Bridge: plain-English guide, positioning, three steps, referrals'
      tags:
      - Liquid Bridge
      description: 'Liquid Bridge: plain-English guide, positioning, three steps, referrals. Free, no payment. Guide: https://api.liquidagent.ai/v1/bridge/guide'
      security:
      - siwx: []
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    siwx:
      type: apiKey
      in: header
      name: SIGN-IN-WITH-X
      description: Sign-In with X wallet identity (EIP-4361). Optional; no payment.
    x402:
      type: http
      scheme: x402
      description: Pay-per-call via x402 (exact scheme, EIP-3009 USDC on Base eip155:8453 or Polygon eip155:137). Sign a USDC authorization; no account, no key held by the server.
externalDocs:
  description: Open-source code examples (JavaScript/viem, Python/web3, curl) + README for the full create/buy/rebalance/exit flow.
  url: https://github.com/LiquidAgent/liquidagentx402
