aid: liquidagent-ai
name: Liquid Agent
description: >-
  Liquid Agent is an agent-native money layer on Base: a USDC account for people (yield, payments and
  stocks from one balance, through the app) and, for AI agents, a permissionless HTTP API at
  api.liquidagent.ai that mints a self-custodied ERC-4626 vault holding Coinbase's tokenized NVDA, META,
  AAPL and GOOGL, buys in from $1, sets custom weights, rebalances and exits to USDC or in-kind any block.
  Reads are free and need no key; every write returns unsigned calldata the agent signs with its own
  wallet. Three paid surfaces settle per call in USDC over x402 v2: basket rebalancing signals ($0.04), a
  shareable portfolio page ($0.25) and an ERC-4337 / ERC-7677 gas sponsor (from $0.03) on Base, Polygon
  and Solana. The contract is a 17-operation OpenAPI 3.1.0 at api.liquidagent.ai/openapi.json, with an
  A2A agent card, llms.txt, agents.txt, an x402 resource catalog, an ERC-8004 on-chain identity and two
  provider-authored Agent Skills in the open-source examples repo.
