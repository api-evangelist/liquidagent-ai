apis:
- aid: liquidagent-ai:liquid-agent-api
  name: Liquid Agent Tokenized Stock Index and Gas Sponsor API
  description: >-
    Agent-facing REST API on Base (eip155:8453). Free reads (basket constituents and live prices, vault
    NAV and weights, an address's vaults and shares, a purchase quote, the plain-English guide) and free
    transaction builders (create-vault, set-weights, buy via EIP-2612 permit, rebalance, redeem to USDC
    or in-kind, send shares) that return unsigned {to,data,value,chainId} for the caller to sign and
    broadcast. Paid over x402 v2 (exact scheme, EIP-3009 USDC on Base or Polygon, Solana USDC for the
    Solana lane): GET /v1/signals ($0.04), POST /v1/publish ($0.25), and the gas sponsor at POST /v1/gas
    and POST /v1/gas/solana (from $0.03, dynamic). No API key, no account; SIWX (EIP-4361) wallet identity
    is optional on free calls.
  image: https://liquidagent.ai/icon.png
  humanURL: https://api.liquidagent.ai/v1/guide
  baseURL: https://api.liquidagent.ai
